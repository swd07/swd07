    <text x="128" y="295" fill="#C9D1D9">COMPUTER VISION</text>
    <rect x="276" y="272" width="132" height="36" rx="18" fill="#161B22" stroke="#30363D"/>
    <text x="303" y="295" fill="#C9D1D9">LLM AGENTS</text>
    <rect x="422" y="272" width="148" height="36" rx="18" fill="#161B22" stroke="#30363D"/>
    <text x="447" y="295" fill="#C9D1D9">GPU INFERENCE</text>
    <rect x="584" y="272" width="176" height="36" rx="18" fill="#161B22" stroke="#30363D"/>
    <text x="610" y="295" fill="#C9D1D9">PRODUCT SYSTEMS</text>
  </g>

  <!-- right terminal card -->
  <g>
    <rect x="835" y="74" width="285" height="210" rx="16" fill="#0D1117" stroke="#30363D"/>
    <circle cx="858" cy="96" r="5" fill="#FF7B72"/><circle cx="876" cy="96" r="5" fill="#D29922"/><circle cx="894" cy="96" r="5" fill="#3FB950"/>
    <text x="858" y="132" fill="#8B949E" font-family="SFMono-Regular, Consolas, monospace" font-size="14">$ deploy production_ai</text>
    <text x="858" y="163" fill="#58A6FF" font-family="SFMono-Regular, Consolas, monospace" font-size="14">cv.pipeline</text>
    <text x="985" y="163" fill="#3FB950" font-family="SFMono-Regular, Consolas, monospace" font-size="14">READY</text>
    <text x="858" y="190" fill="#A371F7" font-family="SFMono-Regular, Consolas, monospace" font-size="14">llm.agents</text>
    <text x="985" y="190" fill="#3FB950" font-family="SFMono-Regular, Consolas, monospace" font-size="14">READY</text>
    <text x="858" y="217" fill="#2DD4BF" font-family="SFMono-Regular, Consolas, monospace" font-size="14">gpu.inference</text>
    <text x="985" y="217" fill="#3FB950" font-family="SFMono-Regular, Consolas, monospace" font-size="14">LIVE</text>

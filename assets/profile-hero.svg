<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="90" y1="60" x2="900" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1005 95) rotate(137) scale(320 260)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="23" stroke="#30363D" stroke-opacity="0.9"/>
  <ellipse cx="1010" cy="110" rx="245" ry="190" fill="url(#glow)" filter="url(#blur)"/>

  <!-- subtle engineering grid -->
  <g opacity="0.12" stroke="#8B949E">
    <path d="M0 72H1200M0 144H1200M0 216H1200M0 288H1200"/>
    <path d="M120 0V360M240 0V360M360 0V360M480 0V360M600 0V360M720 0V360M840 0V360M960 0V360M1080 0V360"/>
  </g>

  <!-- left accent -->
  <rect x="70" y="64" width="6" height="230" rx="3" fill="url(#accent)"/>
  <circle cx="73" cy="64" r="7" fill="#58A6FF"/>

  <text x="104" y="105" fill="#8B949E" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="4">PRODUCTION AI · SYSTEMS · ENGINEERING</text>
  <text x="102" y="164" fill="#F0F6FC" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="750" letter-spacing="1">EDUARD KHARAEV</text>
  <text x="104" y="207" fill="#58A6FF" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650">Applied AI Engineer  ·  AI Platform Architect</text>
  <text x="104" y="246" fill="#C9D1D9" font-family="Segoe UI, Arial, sans-serif" font-size="19">From model inference to measurable business impact.</text>

